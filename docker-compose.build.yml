# Use this instead of docker-compose.yml when you want to build the image yourself
# from this folder (for example after `git clone` on the ZimaOS terminal):
#   docker compose -f docker-compose.build.yml up -d --build
name: church-status

services:
  church-status:
    build: .
    image: church-status:local
    container_name: church-status
    restart: unless-stopped
    ports:
      - "8383:8080"
    environment:
      TZ: America/Santo_Domingo
      # App code used on the first start only. Change it later in the app (Ajustes).
      APP_CODE: "1925"
      SECURE_COOKIES: "false"
    volumes:
      - /DATA/AppData/church-status:/data
